version: '3.8'

services:
  pdf-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-converter
    ports:
      - "3456:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      - BASE_URL=http://localhost:3456
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3456/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pdf-network

networks:
  pdf-network:
    driver: bridge
